services:
  - type: web
    name: epicbloxs
    runtime: node
    plan: free
    # En Free no hay disco persistente; las cuentas se guardan en Render Postgres.
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: epicbloxs-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: epicbloxs-db
    plan: free
