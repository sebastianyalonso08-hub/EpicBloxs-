services:
  - type: web
    name: epicbloxs
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: EPICBLOXS_DATA_DIR
        value: /var/data
    disk:
      name: epicbloxs-data
      mountPath: /var/data
      sizeGB: 1
